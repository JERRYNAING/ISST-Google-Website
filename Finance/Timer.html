<script>
  /* ============================================
     TIMER MANAGER CLASS
     ============================================ */
  /**
   * TimerManager Class
   * Manages the countdown timer functionality, display updates, and user interactions
   */
  class TimerManager {
    /**
     * Constructor
     * Initializes timer configuration and starts the countdown
     */
    constructor() {
      // ============================================
      // TIMER DURATION CONFIGURATION
      // ============================================
      // Change this value to set the countdown duration in hours
      // Example: 24 = 24 hours, 12 = 12 hours, 1 = 1 hour
      this.COUNTDOWN_DURATION_HOURS = 24;
      
      // Calculate total seconds from hours (hours * minutes * seconds)
      this.totalSeconds = this.COUNTDOWN_DURATION_HOURS * 60 * 60;
      
      // Track remaining seconds (starts at totalSeconds)
      this.remainingSeconds = this.totalSeconds;
      
      // Timer state management
      this.isRunning = false;  // Whether the timer is currently running
      this.interval = null;    // Reference to the setInterval for cleanup
      
      // Initialize the timer system
      this.initializeElements();
      this.bindEvents();
      this.start();
    }

    // ============================================
    // INITIALIZATION METHODS
    // ============================================
    
    /**
     * Initialize DOM Elements
     * Gets references to all HTML elements needed for the timer functionality
     */
    initializeElements() {
      // Timer display elements
      this.timerEl = document.getElementById('timer');              // Main timer container
      this.progressFill = document.getElementById('progressFill');  // Progress bar fill element
      this.progressPercent = document.getElementById('progressPercent'); // Progress percentage text
      
      // Status indicator elements
      this.statusIndicator = document.getElementById('statusIndicator'); // Status indicator container
      this.statusText = this.statusIndicator.querySelector('.status-text'); // Status text ("Active", "Expired")
      this.statusDot = this.statusIndicator.querySelector('.status-dot');   // Animated status dot
      
      // Action button elements
      this.downloadBtn = document.getElementById('downloadBtn');  // Download form button
      this.submitBtn = document.getElementById('submitBtn');     // Submit form button

      // Validate that required elements exist
      if (!this.timerEl || !this.progressFill || !this.progressPercent) {
        console.error('Required timer elements not found');
        return;
      }
    }

    /**
     * Bind Event Listeners
     * Attaches click event handlers to the download and submit buttons
     */
    bindEvents() {
      [this.downloadBtn, this.submitBtn].forEach(btn => {
        if (btn) {
          btn.addEventListener('click', (e) => this.handleButtonClick(e));
        }
      });
    }

    // ============================================
    // TIMER CONTROL METHODS
    // ============================================
    
    /**
     * Start Timer
     * Begins the countdown by setting up an interval that ticks every second
     */
    start() {
      this.isRunning = true;
      // Call tick() every 1000ms (1 second)
      this.interval = setInterval(() => this.tick(), 1000);
      // Set initial status to "Active" with green color
      this.updateStatus('Active', '#10b981');
    }

    /**
     * Timer Tick
     * Called every second to decrement the timer and update the display
     */
    tick() {
      // Decrease remaining seconds by 1
      this.remainingSeconds--;
      
      // Check if timer has reached zero
      if (this.remainingSeconds <= 0) {
        this.timeUp();
        return;
      }

      // Update the display and check for warnings
      this.updateDisplay();
      this.checkWarnings();
    }

    // ============================================
    // DISPLAY UPDATE METHODS
    // ============================================
    
    /**
     * Update Display
     * Calculates and displays hours, minutes, seconds, and progress percentage
     */
    updateDisplay() {
      // Calculate time components from remaining seconds
      const hours = Math.floor(this.remainingSeconds / 3600);           // Total hours remaining
      const minutes = Math.floor((this.remainingSeconds % 3600) / 60);  // Minutes in current hour
      const seconds = this.remainingSeconds % 60;                        // Seconds in current minute

      // Get DOM elements for each time segment
      const hoursEl = this.timerEl.querySelector('.hours');
      const minutesEl = this.timerEl.querySelector('.minutes');
      const secondsEl = this.timerEl.querySelector('.seconds');
      
      // Update the displayed time values (pad with zeros for 2-digit format)
      if (hoursEl) hoursEl.textContent = this.pad(hours);
      if (minutesEl) minutesEl.textContent = this.pad(minutes);
      if (secondsEl) secondsEl.textContent = this.pad(seconds);

      // Calculate and update progress bar percentage
      const progressPercent = (this.remainingSeconds / this.totalSeconds) * 100;
      
      // Update progress bar width
      if (this.progressFill) {
        this.progressFill.style.width = `${progressPercent}%`;
      }
      
      // Update progress percentage text
      if (this.progressPercent) {
        this.progressPercent.textContent = `${Math.round(progressPercent)}%`;
      }
    }

    /**
     * Check Warnings
     * Displays visual warnings when time is running low
     * Adjusts warning thresholds based on hours remaining
     */
    checkWarnings() {
      // Convert remaining seconds to hours for warning checks
      const hoursLeft = this.remainingSeconds / 3600;
      
      // Show warning at different thresholds
      if (hoursLeft <= 1 && hoursLeft > 0.5) {
        this.showWarning('Less than 1 hour remaining!');
      } else if (hoursLeft <= 0.5 && hoursLeft > 0.1) {
        this.showWarning('Less than 30 minutes remaining!');
      } else if (hoursLeft <= 0.1) {
        this.showWarning('Less than 6 minutes remaining!');
      }
    }

    /**
     * Show Warning
     * Applies visual warning animation to timer segments
     * @param {string} message - Warning message (currently not displayed, but can be used for future features)
     */
    showWarning(message) {
      const hoursEl = this.timerEl.querySelector('.hours');
      const minutesEl = this.timerEl.querySelector('.minutes');
      const secondsEl = this.timerEl.querySelector('.seconds');
      
      // Add warning class to all time segments (triggers shake animation)
      [hoursEl, minutesEl, secondsEl].forEach(el => {
        if (el) {
          el.classList.add('warning');
          // Remove warning class after 1 second
          setTimeout(() => {
            el.classList.remove('warning');
          }, 1000);
        }
      });
    }

    // ============================================
    // TIMER STATE METHODS
    // ============================================
    
    /**
     * Time Up Handler
     * Called when the countdown reaches zero
     * Stops the timer, updates display, and locks buttons
     */
    timeUp() {
      // Stop the timer
      this.isRunning = false;
      clearInterval(this.interval);
      
      // Get time display elements
      const hoursEl = this.timerEl.querySelector('.hours');
      const minutesEl = this.timerEl.querySelector('.minutes');
      const secondsEl = this.timerEl.querySelector('.seconds');
      
      // Set all time segments to 00 and add danger styling (red, shaking)
      [hoursEl, minutesEl, secondsEl].forEach(el => {
        if (el) {
          el.textContent = '00';
          el.classList.add('danger');
        }
      });
      
      // Set progress bar to 0%
      if (this.progressFill) {
        this.progressFill.style.width = '0%';
      }
      
      // Set progress text to 0%
      if (this.progressPercent) {
        this.progressPercent.textContent = '0%';
      }

      // Disable download and submit buttons
      this.lockButtons();
      // Update status to "Expired" with red color
      this.updateStatus('Expired', '#ef4444');
    }

    /**
     * Lock Buttons
     * Disables the download and submit buttons when timer expires
     */
    lockButtons() {
      [this.downloadBtn, this.submitBtn].forEach(btn => {
        if (btn) {
          btn.classList.add('disabled');
          btn.setAttribute('aria-disabled', 'true');
        }
      });
    }

    // ============================================
    // UI UPDATE METHODS
    // ============================================
    
    /**
     * Update Status Indicator
     * Updates the status text and dot color
     * @param {string} text - Status text to display ("Active", "Expired", etc.)
     * @param {string} color - Color code for the status dot
     */
    updateStatus(text, color) {
      // Update status text
      if (this.statusText) {
        this.statusText.textContent = text;
      }
      
      // Update status dot color and glow effect
      if (this.statusDot) {
        this.statusDot.style.background = color;
        this.statusDot.style.boxShadow = `0 0 20px ${color}`;
      }
    }

    // ============================================
    // EVENT HANDLER METHODS
    // ============================================
    
    /**
     * Handle Button Click
     * Manages button click interactions and loading states
     * @param {Event} e - Click event object
     */
    handleButtonClick(e) {
      const btn = e.currentTarget;
      
      // Prevent action if button is disabled
      if (btn.classList.contains('disabled')) {
        e.preventDefault();
        return;
      }

      // Show loading state
      btn.classList.add('loading');
      const buttonElement = btn.querySelector('.download-button') || btn.querySelector('.submit-button');
      const originalContent = buttonElement.querySelector('.button-content').innerHTML;
      buttonElement.querySelector('.button-content').innerHTML = '<span>Opening...</span>';
      
      // Reset loading state after 2 seconds
      setTimeout(() => {
        btn.classList.remove('loading');
        buttonElement.querySelector('.button-content').innerHTML = originalContent;
      }, 2000);
    }

    // ============================================
    // UTILITY METHODS
    // ============================================
    
    /**
     * Pad Number
     * Formats numbers to always have 2 digits (e.g., 5 -> "05")
     * @param {number} num - Number to pad
     * @returns {string} - Padded string
     */
    pad(num) {
      return num.toString().padStart(2, '0');
    }
  }

  /* ============================================
     INITIALIZATION
     ============================================ */
  /**
   * Initialize Timer on Page Load
   * Creates a new TimerManager instance when the DOM is fully loaded
   */
  document.addEventListener('DOMContentLoaded', function() {
    new TimerManager();
  });
</script>
