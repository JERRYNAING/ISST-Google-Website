<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISST Event Memories</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #edecec;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #555;
    }

    .memories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .memory-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .memory-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 10px;
      background: #f3f4f6;
    }

    .memory-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 0 0 6px;
    }

    .memory-meta {
      font-size: 0.9rem;
      color: #6b7280;
      margin: 0 0 8px;
    }

    .memory-desc {
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Event Memories</h1>
    <p class="subtitle">Previous ISST events and highlights.</p>

    <div id="memories" class="memories-grid"></div>
  </div>

  <script>
    // Update this list to add/edit memories
    const MEMORIES = [
      {
        title: 'Open Day 2026',
        date: '2026-02-05',
        location: 'INTI College Subang',
        image: '',
        description: 'Registration booth support, on-site guidance, and IT assistance.'
      },
      {
        title: 'IT Helpdesk Workshop',
        date: '2025-11-20',
        location: 'ISST Lab',
        image: '',
        description: 'Hands-on training for troubleshooting and standard workflows.'
      }
    ];

    function renderMemories(items) {
      const container = document.getElementById('memories');
      container.innerHTML = '';

      items.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'memory-card';

        if (item.image) {
          const img = document.createElement('img');
          img.src = item.image;
          img.alt = item.title;
          card.appendChild(img);
        }

        const title = document.createElement('h2');
        title.className = 'memory-title';
        title.textContent = item.title;
        card.appendChild(title);

        const meta = document.createElement('p');
        meta.className = 'memory-meta';
        meta.textContent = `${item.date} • ${item.location}`;
        card.appendChild(meta);

        const desc = document.createElement('p');
        desc.className = 'memory-desc';
        desc.textContent = item.description;
        card.appendChild(desc);

        container.appendChild(card);
      });
    }

    renderMemories(MEMORIES);
  </script>
</body>
</html>
