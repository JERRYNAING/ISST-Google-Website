<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Day Form</title>
  <style>
    /* ============================================
       GLOBAL STYLES
       ============================================ */
    body {
      font-family: Arial, sans-serif;
      background: #edecec;
      padding: 20px;
      margin: 0;
    }

    /* ============================================
       FORM CARD
       ============================================ */
    .form-card {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 24px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #333;
    }

    /* ============================================
       FORM ELEMENTS
       ============================================ */
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 16px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    /* Error State: Red border when validation fails */
    input[type="text"].error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.2);
    }

    /* Success State: Green border when valid */
    input[type="text"].success {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
    }

    /* ============================================
       ROLE SELECTION STYLES
       ============================================ */
    .role-selection {
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 16px;
      padding: 15px;
      background: #f9fafb;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .role-selection.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.2);
    }

    .role-selection.success {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
    }

    .role-option {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px;
      background: #ffffff;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .role-option:hover {
      background: #f3f4f6;
      border-color: #3b82f6;
    }

    .role-option:last-child {
      margin-bottom: 0;
    }

    .role-option input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #3b82f6;
    }

    .role-option input[type="checkbox"]:checked + .role-label {
      font-weight: bold;
      color: #3b82f6;
    }

    .role-label {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .role-name {
      font-size: 1rem;
      color: #333;
    }

    .slot-info {
      font-size: 0.875rem;
      padding: 4px 10px;
      border-radius: 16px;
      font-weight: 600;
    }

    .slot-available {
      background: #d1fae5;
      color: #059669;
    }

    .slot-low {
      background: #fef3c7;
      color: #d97706;
    }

    .slot-full {
      background: #fee2e2;
      color: #dc2626;
    }

    .role-option:has(input:disabled) {
      opacity: 0.5;
      cursor: not-allowed;
      background: #f3f4f6;
    }

    .role-option:has(input:disabled):hover {
      border-color: transparent;
      background: #f3f4f6;
    }

    /* ============================================
       BUTTON STYLES
       ============================================ */
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #3b82f6;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    /* ============================================
       ERROR MESSAGE STYLES
       ============================================ */
    .error-message {
      display: block;
      margin-top: 5px;
      font-size: 0.875rem;
      color: #ef4444;
      min-height: 20px;
    }

    /* ============================================
       STATUS MESSAGE STYLES
       ============================================ */
    .status {
      display: block;
      margin-top: 15px;
      font-size: 0.95rem;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .status.ok {
      color: #10b981;
      background: #d1fae5;
      border: 1px solid #10b981;
    }

    .status.err {
      color: #ef4444;
      background: #fee2e2;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>
  <!-- ============================================
       FORM STRUCTURE
       ============================================ -->
  <div class="form-card">
    <h2>Open Day Registration</h2>
    <form id="od-form" novalidate>
      <!-- Name Field -->
      <label for="name">Name:</label>
      <input 
        id="name" 
        name="name" 
        type="text" 
        placeholder="Enter your full name"
        autocomplete="name"
      />
      <span id="name-error" class="error-message"></span>

      <!-- Role Selection Field -->
      <label>Select Role(s):</label>
      <div id="role-selection" class="role-selection">
        <div class="role-option">
          <input 
            type="checkbox" 
            id="role-runner" 
            name="role" 
            value="Runner"
          />
          <label for="role-runner" class="role-label">
            <span class="role-name">Runner</span>
            <span id="runner-slots" class="slot-info slot-available">
              <span id="runner-available">0</span> slots available
            </span>
          </label>
        </div>
        <div class="role-option">
          <input 
            type="checkbox" 
            id="role-gatekeeper" 
            name="role" 
            value="Gatekeeper"
          />
          <label for="role-gatekeeper" class="role-label">
            <span class="role-name">Gatekeeper</span>
            <span id="gatekeeper-slots" class="slot-info slot-available">
              <span id="gatekeeper-available">0</span> slots available
            </span>
          </label>
        </div>
      </div>
      <span id="role-error" class="error-message"></span>

      <!-- Event Name Field -->
      <label for="event">Event Name:</label>
      <input 
        id="event" 
        name="event" 
        type="text" 
        placeholder="Enter the event name"
        autocomplete="off"
      />
      <span id="event-error" class="error-message"></span>

      <!-- Submit Button -->
      <button id="submitBtn" type="submit">Submit</button>
      
      <!-- Status Message -->
      <span id="status" class="status"></span>
    </form>
  </div>

  <script>
    /* ============================================
       CONFIGURATION
       ============================================ */
    /**
     * GOOGLE APPS SCRIPT WEB APP URL
     * 
     * This form uses Google Sheets as the backend database via Google Apps Script.
     * 
     * SETUP INSTRUCTIONS:
     * 1. Create a Google Sheet with columns: Name, Role, Event, Timestamp
     * 2. Create a Google Apps Script project (Extensions > Apps Script)
     * 3. Copy the code from Events/README.md (Google Apps Script section)
     * 4. Update the SPREADSHEET_ID in the script
     * 5. Deploy as Web App:
     *    - Click "Deploy" > "New deployment"
     *    - Type: Web app
     *    - Execute as: Me
     *    - Who has access: Anyone
     * 6. Copy the Web App URL and paste it below
     * 
     * The URL should look like:
     * https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec
     * 
     * For detailed setup instructions, see Events/README.md
     */
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    // Slot Configuration
    // Total slots available for each role
    // To update slot counts dynamically, modify the 'taken' values below
    // or fetch them from your server/Google Sheets
    const SLOT_CONFIG = {
      runner: {
        total: 20,        // Total slots for Runner
        taken: 5          // Currently taken slots (update this dynamically if needed)
      },
      gatekeeper: {
        total: 15,        // Total slots for Gatekeeper
        taken: 3          // Currently taken slots (update this dynamically if needed)
      }
    };
    
    // Note: In production, you may want to fetch slot counts from your backend
    // Example: fetch('/api/slots').then(res => res.json()).then(data => {
    //   SLOT_CONFIG.runner.taken = data.runner.taken;
    //   SLOT_CONFIG.gatekeeper.taken = data.gatekeeper.taken;
    //   updateSlotDisplay();
    // });

    /* ============================================
       DOM ELEMENTS
       ============================================ */
    const form = document.getElementById('od-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    
    // Form fields
    const nameField = document.getElementById('name');
    const eventField = document.getElementById('event');
    
    // Role selection elements
    const roleSelection = document.getElementById('role-selection');
    const runnerCheckbox = document.getElementById('role-runner');
    const gatekeeperCheckbox = document.getElementById('role-gatekeeper');
    const runnerSlotsEl = document.getElementById('runner-slots');
    const runnerAvailableEl = document.getElementById('runner-available');
    const gatekeeperSlotsEl = document.getElementById('gatekeeper-slots');
    const gatekeeperAvailableEl = document.getElementById('gatekeeper-available');
    
    // Error message elements
    const nameError = document.getElementById('name-error');
    const roleError = document.getElementById('role-error');
    const eventError = document.getElementById('event-error');

    /* ============================================
       VALIDATION FUNCTIONS
       ============================================ */
    
    /**
     * Validate Name Field
     * @param {string} value - Name value to validate
     * @returns {string|null} - Error message or null if valid
     */
    function validateName(value) {
      const trimmed = value.trim();
      
      if (!trimmed) {
        return 'Name is required';
      }
      
      if (trimmed.length < 2) {
        return 'Name must be at least 2 characters long';
      }
      
      if (trimmed.length > 100) {
        return 'Name must be less than 100 characters';
      }
      
      // Check for valid name format (letters, spaces, hyphens, apostrophes)
      const namePattern = /^[a-zA-Z\s'-]+$/;
      if (!namePattern.test(trimmed)) {
        return 'Name can only contain letters, spaces, hyphens, and apostrophes';
      }
      
      return null;
    }

    /**
     * Get Available Slots for a Role
     * @param {string} role - Role name ('runner' or 'gatekeeper')
     * @returns {number} - Number of available slots
     */
    function getAvailableSlots(role) {
      const config = SLOT_CONFIG[role];
      if (!config) return 0;
      return Math.max(0, config.total - config.taken);
    }

    /**
     * Update Slot Display
     * Updates the visual display of available slots for each role
     */
    function updateSlotDisplay() {
      const runnerAvailable = getAvailableSlots('runner');
      const gatekeeperAvailable = getAvailableSlots('gatekeeper');

      // Update Runner display
      runnerAvailableEl.textContent = runnerAvailable;
      if (runnerAvailable === 0) {
        runnerSlotsEl.className = 'slot-info slot-full';
        runnerSlotsEl.textContent = 'No slots available';
        runnerCheckbox.disabled = true;
      } else if (runnerAvailable <= 3) {
        runnerSlotsEl.className = 'slot-info slot-low';
        runnerSlotsEl.textContent = `${runnerAvailable} slots available`;
        runnerCheckbox.disabled = false;
      } else {
        runnerSlotsEl.className = 'slot-info slot-available';
        runnerSlotsEl.textContent = `${runnerAvailable} slots available`;
        runnerCheckbox.disabled = false;
      }

      // Update Gatekeeper display
      gatekeeperAvailableEl.textContent = gatekeeperAvailable;
      if (gatekeeperAvailable === 0) {
        gatekeeperSlotsEl.className = 'slot-info slot-full';
        gatekeeperSlotsEl.textContent = 'No slots available';
        gatekeeperCheckbox.disabled = true;
      } else if (gatekeeperAvailable <= 3) {
        gatekeeperSlotsEl.className = 'slot-info slot-low';
        gatekeeperSlotsEl.textContent = `${gatekeeperAvailable} slots available`;
        gatekeeperCheckbox.disabled = false;
      } else {
        gatekeeperSlotsEl.className = 'slot-info slot-available';
        gatekeeperSlotsEl.textContent = `${gatekeeperAvailable} slots available`;
        gatekeeperCheckbox.disabled = false;
      }
    }

    /**
     * Get Selected Roles
     * @returns {string[]} - Array of selected role values
     */
    function getSelectedRoles() {
      const selected = [];
      if (runnerCheckbox.checked) selected.push('Runner');
      if (gatekeeperCheckbox.checked) selected.push('Gatekeeper');
      return selected;
    }

    /**
     * Validate Role Selection
     * @returns {string|null} - Error message or null if valid
     */
    function validateRoleSelection() {
      const selectedRoles = getSelectedRoles();
      
      if (selectedRoles.length === 0) {
        return 'Please select at least one role';
      }

      // Check if selected roles have available slots
      for (const role of selectedRoles) {
        const roleKey = role.toLowerCase();
        const available = getAvailableSlots(roleKey);
        
        if (available === 0) {
          return `${role} role has no available slots`;
        }
      }
      
      return null;
    }

    /**
     * Validate Event Name Field
     * @param {string} value - Event name value to validate
     * @returns {string|null} - Error message or null if valid
     */
    function validateEvent(value) {
      const trimmed = value.trim();
      
      if (!trimmed) {
        return 'Event name is required';
      }
      
      if (trimmed.length < 3) {
        return 'Event name must be at least 3 characters long';
      }
      
      if (trimmed.length > 100) {
        return 'Event name must be less than 100 characters';
      }
      
      return null;
    }

    /**
     * Display Field Error
     * @param {HTMLElement} field - Input element
     * @param {HTMLElement} errorEl - Error message element
     * @param {string} message - Error message to display
     */
    function showFieldError(field, errorEl, message) {
      if (field) {
        field.classList.remove('success');
        field.classList.add('error');
      }
      if (errorEl) {
        errorEl.textContent = message;
      }
    }

    /**
     * Display Role Selection Error
     * @param {string} message - Error message to display
     */
    function showRoleError(message) {
      roleSelection.classList.remove('success');
      roleSelection.classList.add('error');
      roleError.textContent = message;
    }

    /**
     * Clear Field Error
     * @param {HTMLElement} field - Input element
     * @param {HTMLElement} errorEl - Error message element
     */
    function clearFieldError(field, errorEl) {
      if (field) {
        field.classList.remove('error');
        field.classList.add('success');
      }
      if (errorEl) {
        errorEl.textContent = '';
      }
    }

    /**
     * Clear Role Selection Error
     */
    function clearRoleError() {
      roleSelection.classList.remove('error');
      roleSelection.classList.add('success');
      roleError.textContent = '';
    }

    /**
     * Clear All Field Errors
     */
    function clearAllErrors() {
      clearFieldError(nameField, nameError);
      clearRoleError();
      clearFieldError(eventField, eventError);
    }

    /**
     * Validate All Fields
     * @returns {boolean} - True if all fields are valid, false otherwise
     */
    function validateForm() {
      let isValid = true;
      
      // Clear previous errors
      clearAllErrors();
      
      // Validate Name
      const nameValue = nameField.value;
      const nameValidationError = validateName(nameValue);
      if (nameValidationError) {
        showFieldError(nameField, nameError, nameValidationError);
        isValid = false;
      } else {
        clearFieldError(nameField, nameError);
      }
      
      // Validate Role Selection
      const roleValidationError = validateRoleSelection();
      if (roleValidationError) {
        showRoleError(roleValidationError);
        isValid = false;
      } else {
        clearRoleError();
      }
      
      // Validate Event Name
      const eventValue = eventField.value;
      const eventValidationError = validateEvent(eventValue);
      if (eventValidationError) {
        showFieldError(eventField, eventError, eventValidationError);
        isValid = false;
      } else {
        clearFieldError(eventField, eventError);
      }
      
      return isValid;
    }

    /* ============================================
       INITIALIZE SLOT DISPLAY
       ============================================ */
    // Update slot display on page load
    updateSlotDisplay();

    /* ============================================
       REAL-TIME VALIDATION
       ============================================ */
    // Validate name field on blur
    nameField.addEventListener('blur', () => {
      const error = validateName(nameField.value);
      if (error) {
        showFieldError(nameField, nameError, error);
      } else {
        clearFieldError(nameField, nameError);
      }
    });

    // Validate role selection when checkboxes change
    runnerCheckbox.addEventListener('change', () => {
      const error = validateRoleSelection();
      if (error) {
        showRoleError(error);
      } else {
        clearRoleError();
      }
    });

    gatekeeperCheckbox.addEventListener('change', () => {
      const error = validateRoleSelection();
      if (error) {
        showRoleError(error);
      } else {
        clearRoleError();
      }
    });

    // Validate event field on blur
    eventField.addEventListener('blur', () => {
      const error = validateEvent(eventField.value);
      if (error) {
        showFieldError(eventField, eventError, error);
      } else {
        clearFieldError(eventField, eventError);
      }
    });

    // Clear error styling on input (user is typing)
    nameField.addEventListener('input', () => {
      nameField.classList.remove('error');
      nameError.textContent = '';
    });

    // Clear role error when user interacts with checkboxes
    runnerCheckbox.addEventListener('change', () => {
      const error = validateRoleSelection();
      if (!error) {
        clearRoleError();
      }
    });

    gatekeeperCheckbox.addEventListener('change', () => {
      const error = validateRoleSelection();
      if (!error) {
        clearRoleError();
      }
    });

    eventField.addEventListener('input', () => {
      eventField.classList.remove('error');
      eventError.textContent = '';
    });

    /* ============================================
       FORM SUBMISSION
       ============================================ */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear previous status message
      statusEl.textContent = '';
      statusEl.className = 'status';
      
      // Validate all fields before submission
      if (!validateForm()) {
        statusEl.textContent = 'Please fix the errors above before submitting.';
        statusEl.className = 'status err';
        // Scroll to first error
        const firstError = form.querySelector('.error');
        if (firstError) {
          firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
          firstError.focus();
        }
        return;
      }
      
      // Disable submit button and show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      statusEl.textContent = 'Submitting...';
      statusEl.className = 'status';

      try {
        // Get selected roles
        const selectedRoles = getSelectedRoles();
        
        // Prepare payload with trimmed values
        const payload = {
          name: nameField.value.trim(),
          role: selectedRoles.join(', '), // Join multiple roles with comma
          event: eventField.value.trim(),
        };

        // Send data to Google Apps Script Web App
        // Note: Make sure your Google Apps Script is deployed with "Who has access: Anyone"
        const res = await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Google Apps Script returns JSON response
        const data = await res.json().catch(() => {
          // If response is not JSON, assume success if status is ok
          return { ok: res.ok || res.status === 200 };
        });

        if (res.ok && data.ok) {
          // Success: Show success message and reset form
          statusEl.textContent = 'Saved! Thank you for your registration.';
          statusEl.className = 'status ok';
          
          // Reset form and clear selections
          form.reset();
          clearAllErrors();
          
          // Update slot display after successful submission
          // Optionally update slot counts from server response
          // Example: if (data.slots) { SLOT_CONFIG.runner.taken = data.slots.runner.taken; }
          updateSlotDisplay();
          
          // Reset button after a delay
          setTimeout(() => {
            submitBtn.textContent = 'Submit';
          }, 2000);
        } else {
          throw new Error(data.error || 'Failed to save. Please try again.');
        }
      } catch (err) {
        // Error: Show error message
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'status err';
        submitBtn.textContent = 'Submit';
      } finally {
        // Re-enable submit button
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
